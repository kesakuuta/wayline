[package]
name = "wayline"
version = "0.2.0"
edition = "2021"
authors = ["Wayline contributors"]
description = "Wayline native desktop VPN client"

[dependencies]
slint = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
