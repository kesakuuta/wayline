name: Android APK build

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK (Native Kotlin / Jetpack Compose)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Sign APK for testing
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$HOME/.android" signed-apk
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" signed-apk/wayline-unsigned-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out signed-apk/Wayline-debug-signed.apk \
            signed-apk/wayline-unsigned-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs signed-apk/Wayline-debug-signed.apk
          rm signed-apk/wayline-unsigned-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wayline-android-arm64-signed-apk
          path: signed-apk/Wayline-debug-signed.apk
          if-no-files-found: error
