name: Portable desktop ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - '.github/workflows/portable-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 portable ZIP (Pure Native Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Download sing-box, Xray and GeoIP/GeoSite
        run: python scripts/fetch-runtime-binaries.py windows
      - name: Build native desktop executable
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "desktop/target/release/wayline.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable not found: $exe" }
          $portable = "portable-windows"
          New-Item -ItemType Directory -Force "$portable/binaries" | Out-Null
          Copy-Item $exe "$portable/Wayline.exe"
          Copy-Item "src-tauri/binaries/*" "$portable/binaries/" -Force
          Copy-Item README.md, LICENSE $portable/
          Compress-Archive -Path "$portable/*" -DestinationPath "Wayline-Windows-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Wayline-Windows-Portable
          path: Wayline-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 portable ZIP (Pure Native Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Download sing-box, Xray and GeoIP/GeoSite
        run: python3 scripts/fetch-runtime-binaries.py linux
      - name: Build native Linux executable
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: Assemble portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          BIN="desktop/target/release/wayline"
          test -f "$BIN"
          mkdir -p portable-linux/binaries
          cp "$BIN" portable-linux/Wayline
          chmod +x portable-linux/Wayline
          cp src-tauri/binaries/* portable-linux/binaries/ || true
          cp README.md LICENSE portable-linux/
          (cd portable-linux && zip -9 -r ../Wayline-Linux-Portable.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Wayline-Linux-Portable
          path: Wayline-Linux-Portable.zip
          if-no-files-found: error
          retention-days: 14
