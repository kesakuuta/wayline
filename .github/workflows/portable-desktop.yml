name: Portable desktop ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/portable-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Download sing-box, Xray and GeoIP/GeoSite
        run: python scripts/fetch-runtime-binaries.py windows
      - name: Build desktop executable
        run: cargo tauri build --no-bundle
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "src-tauri/target/release/wayline-vpn.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable not found: $exe" }
          $portable = "portable-windows"
          New-Item -ItemType Directory -Force "$portable/resources/binaries" | Out-Null
          Copy-Item $exe "$portable/Wayline.exe"
          Copy-Item "src-tauri/binaries/*" "$portable/resources/binaries/" -Force
          Copy-Item README.md, LICENSE $portable/
          Compress-Archive -Path "$portable/*" -DestinationPath "Wayline-Windows-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Wayline-Windows-Portable
          path: Wayline-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 AppImage in ZIP
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Download sing-box, Xray and GeoIP/GeoSite
        run: python3 scripts/fetch-runtime-binaries.py linux
      - name: Build AppImage
        run: cargo tauri build --bundles appimage
      - name: Assemble portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          test -n "$APPIMAGE"
          mkdir -p portable-linux
          cp "$APPIMAGE" portable-linux/Wayline.AppImage
          cp README.md LICENSE portable-linux/
          (cd portable-linux && zip -9 -r ../Wayline-Linux-Portable.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Wayline-Linux-Portable
          path: Wayline-Linux-Portable.zip
          if-no-files-found: error
          retention-days: 14
