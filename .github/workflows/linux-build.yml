name: Linux desktop build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_VERSION: v26.10.31
  SING_BOX_VERSION: 1.14.4
  XRAY_LINUX_SHA256: e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214
  SING_BOX_LINUX_SHA256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf unzip
      - name: Install frontend dependencies
        run: npm install --no-audit
      - name: Download official core binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          curl -fL "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip" -o /tmp/xray.zip
          echo "$XRAY_LINUX_SHA256  /tmp/xray.zip" | sha256sum -c -
          mkdir -p /tmp/xray && unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 0755 "$(find /tmp/xray -type f -name xray | head -n 1)" src-tauri/binaries/xray
          for asset in geoip.dat geosite.dat; do
            asset_path="$(find /tmp/xray -type f -name "$asset" | head -n 1)"
            test -n "$asset_path"
            install -m 0644 "$asset_path" "src-tauri/binaries/$asset"
          done
          curl -fL "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          echo "$SING_BOX_LINUX_SHA256  /tmp/sing-box.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sing-box && tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box
          install -m 0755 "$(find /tmp/sing-box -type f -name sing-box | head -n 1)" src-tauri/binaries/sing-box
          src-tauri/binaries/xray version
          src-tauri/binaries/sing-box version
      - name: Frontend build and tests
        run: |
          npm run build
          npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Linux packages
        run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: wayline-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
